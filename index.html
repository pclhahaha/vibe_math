<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="122 门交互式数学物理课程，依据普林斯顿数学指南组织，可视化与讲义并重" />
  <meta property="og:title" content="Vibe Math — 交互式数学物理学习" />
  <meta property="og:description" content="122 门交互课程（p5.js + KaTeX）：从微积分到 Yang–Mills，含讲义与资格考试题。" />
  <title>Vibe Math — 交互式数学物理学习</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#0d1117;color:#c9d1d9;min-height:100vh}
    ::selection{background:rgba(88,166,255,.35)}
    .hero{text-align:center;padding:60px 20px 26px;background:linear-gradient(180deg,#161b22 0%,#0d1117 100%)}
    .hero h1{font-size:2.6em;color:#58a6ff;font-weight:800;letter-spacing:-1px}
    .hero .desc{color:#8b949e;margin-top:8px;font-size:1.05em;max-width:600px;margin-left:auto;margin-right:auto;line-height:1.6}
    .stats{margin-top:18px;display:flex;justify-content:center;gap:32px;flex-wrap:wrap}
    .stat{text-align:center;min-width:52px}
    .stat .num{font-size:1.6em;font-weight:700;color:#58a6ff}
    .stat .label{font-size:.7em;color:#8b949e;text-transform:uppercase;letter-spacing:1px;margin-top:2px}
    .quick-links{margin-top:16px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
    .quick-links a{display:inline-flex;align-items:center;gap:6px;padding:7px 18px;background:#161b22;border:1px solid #30363d;border-radius:20px;color:#c9d1d9;text-decoration:none;font-size:.85em;transition:all .2s}
    .quick-links a:hover{border-color:#58a6ff;color:#58a6ff;transform:translateY(-1px)}
    .toolbar{max-width:1100px;margin:14px auto 0;padding:0 20px;display:flex;flex-direction:column;gap:9px}
    .search-row{position:relative;max-width:520px;margin:0 auto;width:100%}
    .search-row input{width:100%;padding:11px 42px 11px 20px;background:#161b22;border:1px solid #30363d;border-radius:24px;color:#c9d1d9;font-size:.95em;outline:none;transition:all .2s;box-shadow:0 0 0 0 rgba(88,166,255,0)}
    .search-row input:focus{border-color:#58a6ff;box-shadow:0 0 0 3px rgba(88,166,255,.15)}
    .search-row input::placeholder{color:#484f58}
    .search-row .kbd{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:.7em;color:#484f58;border:1px solid #30363d;border-radius:4px;padding:1px 6px;background:#0d1117}
    .tab-row{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-start}
    .tab,.chip{display:inline-block;padding:5px 13px;border-radius:16px;font-size:.8em;cursor:pointer;border:1px solid #30363d;background:#161b22;color:#8b949e;transition:all .15s;user-select:none}
    .tab:hover,.chip:hover{border-color:#484f58;color:#c9d1d9}
    .tab.active,.chip.active{background:#1a2a3a;border-color:#58a6ff;color:#58a6ff}
    .result-bar{display:flex;justify-content:space-between;align-items:center;color:#484f58;font-size:.8em;padding:8px 20px;max-width:1100px;margin:0 auto}
    .result-bar button{background:none;border:none;color:#58a6ff;cursor:pointer;font-size:.8em;opacity:.8;transition:opacity .15s}
    .result-bar button:hover{opacity:1;text-decoration:underline}
    .container{max-width:1100px;margin:0 auto;padding:8px 20px 60px}
    .section-header{margin:22px 0 8px;padding-bottom:8px;border-bottom:1px solid #21262d;display:flex;align-items:center;gap:10px}
    .section-header h2{font-size:.92em;color:#c9d1d9}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:8px;margin-bottom:4px}
    .card{background:#161b22;border:1px solid #21262d;border-radius:10px;padding:14px 15px;cursor:pointer;transition:all .2s;text-decoration:none;color:inherit;display:flex;align-items:flex-start;gap:9px;animation:rise .25s ease}
    @keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
    .card:hover{border-color:#58a6ff;transform:translateY(-2px);background:#1a2332}
    .card .emoji{font-size:1.25em;flex-shrink:0;width:26px;text-align:center;line-height:1.3}
    .card .info{flex:1;min-width:0}
    .card h3{font-size:.84em;color:#58a6ff;margin-bottom:2px;display:flex;align-items:center;gap:5px;font-weight:600}
    .card h3 .tier-dot{display:inline-block;width:6px;height:6px;border-radius:50%;flex-shrink:0}
    .card p{font-size:.73em;color:#8b949e;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .card .cat-tag{font-size:.62em;color:#484f58;margin-top:4px;display:inline-block;background:#1f2937;padding:1px 8px;border-radius:3px}
    .hidden{display:none!important}
    .empty-state{text-align:center;padding:50px 20px;color:#484f58}
    .empty-state .icon{font-size:3em;margin-bottom:12px}
    .empty-state .hint{margin-top:8px;font-size:.85em;color:#8b949e}
    .skeleton{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:8px}
    .skeleton .sk{background:#161b22;border:1px solid #21262d;border-radius:10px;padding:14px 15px;height:78px;display:flex;gap:9px;align-items:flex-start}
    .skeleton .sk .e{width:26px;height:26px;border-radius:50%;background:#1f2937;animation:pulse 1.2s ease infinite}
    .skeleton .sk .lines{flex:1;display:flex;flex-direction:column;gap:6px}
    .skeleton .sk .l1{height:10px;width:60%;background:#1f2937;border-radius:4px;animation:pulse 1.2s ease infinite}
    .skeleton .sk .l2{height:8px;width:90%;background:#161b22;border-radius:4px;animation:pulse 1.2s ease infinite 0.2s}
    @keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
    footer{text-align:center;padding:40px;color:#484f58;font-size:.8em}
    footer a{color:#58a6ff;text-decoration:none}
    @media(max-width:640px){
      .hero h1{font-size:1.8em}
      .hero{padding:36px 16px 20px}
      .grid{grid-template-columns:1fr}
      .stats{gap:16px}
      .kbd{display:none}
    }
  </style>
</head>
<body>
<div class="hero">
  <h1>🌀 Vibe Math</h1>  <div class="stats">
    <div class="stat"><div class="num" id="stat-math">📐</div><div class="label">数学</div></div>
    <div class="stat"><div class="num" id="stat-phys">⚛️</div><div class="label">物理</div></div>
    <div class="stat"><div class="num" id="stat-total">122</div><div class="label">课程</div></div>
  </div>
  <div class="quick-links">
    <a href="/learn.html">🧭 学习路径</a>
    <a href="/quals.html">🏛 资格考试问题</a>
  </div>
</div>

<div class="toolbar">
  <div class="search-row">
    <input type="text" id="search" placeholder="搜索课程... 如 量子、曲率、群">
    <span class="kbd">/</span>
  </div>
  <div class="tab-row" id="tab-domain">
    <span class="tab active" data-domain="all">全部</span>
    <span class="tab" data-domain="math">📐 数学</span>
    <span class="tab" data-domain="phys">⚛️ 物理</span>
  </div>
  <div class="tab-row" id="tab-tier">
    <span class="tab active" data-tier="all">全部难度</span>
    <span class="tab" data-tier="★">★ 基础</span>
    <span class="tab" data-tier="★★">★★ 核心</span>
    <span class="tab" data-tier="★★★">★★★ 前沿</span>
  </div>
  <div class="tab-row" id="chip-cats"></div>
</div>

<div class="result-bar">
  <span id="result-count"></span>
  <button id="clear-filters">清除筛选</button>
</div>

<div class="container" id="grid"><div class="skeleton" id="skeleton">
  <div class="sk"><div class="e"></div><div class="lines"><div class="l1"></div><div class="l2"></div></div></div>
  <div class="sk"><div class="e"></div><div class="lines"><div class="l1"></div><div class="l2"></div></div></div>
  <div class="sk"><div class="e"></div><div class="lines"><div class="l1"></div><div class="l2"></div></div></div>
  <div class="sk"><div class="e"></div><div class="lines"><div class="l1"></div><div class="l2"></div></div></div>
  <div class="sk"><div class="e"></div><div class="lines"><div class="l1"></div><div class="l2"></div></div></div>
  <div class="sk"><div class="e"></div><div class="lines"><div class="l1"></div><div class="l2"></div></div></div>
</div></div>
<footer><p>MIT License · Built with p5.js + KaTeX · <a href="https://github.com">GitHub</a></p></footer>

<script type="module" src="/src/shared/base-patch.js"></script>
<script type="module">
import Fuse from 'fuse.js';

let allLessons = [];
let mathLessons = [];
let physLessons = [];
let activeDomain = 'all';
let activeTier = 'all';
let activeCat = '';
let fuse = null;

const isPhysics = cat => ['量子力学','统计力学','相对论','量子场论','热力学','流体力学','凝聚态','粒子物理','宇宙学','量子信息','光学','核物理','物理'].some(k => cat.includes(k));

// Bind events (module scope — inline onclick cannot reach here)
document.getElementById('search').addEventListener('input', applyFilters);
document.getElementById('clear-filters').addEventListener('click', clearFilters);
// "/" focuses search
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== document.getElementById('search')) {
    e.preventDefault();
    document.getElementById('search').focus();
  }
  if (e.key === 'Escape' && document.activeElement === document.getElementById('search')) {
    document.getElementById('search').blur();
  }
});

Promise.all([
  fetch(import.meta.env.BASE_URL + 'curriculum.json').then(r => r.json()),
  fetch(import.meta.env.BASE_URL + 'search-index.json').then(r => r.json()).catch(() => []),
]).then(([data, searchIdx]) => {
  const sk = document.getElementById('skeleton');
  if (sk) sk.remove();
  allLessons = data;
  // merge content text into lessons for full-text search
  const contentMap = {};
  if (Array.isArray(searchIdx)) {
    searchIdx.forEach(item => { contentMap[item.id] = item.content || ''; });
    allLessons.forEach(l => { l.content = contentMap[l.id] || ''; });
  }
  fuse = new Fuse(allLessons, {
    keys: [
      { name: 'title', weight: 3 },
      { name: 'category', weight: 2 },
      { name: 'desc', weight: 2 },
      { name: 'content', weight: 1 },
    ],
    threshold: 0.4,
    ignoreLocation: true,
    includeScore: true,
  });
  data.forEach(l => {
    if (isPhysics(l.category)) physLessons.push(l);
    else mathLessons.push(l);
  });
  document.getElementById('stat-total').textContent = data.length;
  document.getElementById('stat-math').textContent = mathLessons.length;
  document.getElementById('stat-phys').textContent = physLessons.length;
  buildCatChips(data);
  applyFilters();
});

function buildCatChips(data) {
  const cats = [...new Set(data.map(l => l.category))].sort();
  const row = document.getElementById('chip-cats');
  cats.forEach(cat => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.textContent = cat;
    chip.dataset.cat = cat;
    chip.addEventListener('click', () => {
      document.querySelectorAll('#chip-cats .chip').forEach(c => c.classList.remove('active'));
      if (activeCat === cat) { activeCat = ''; }
      else { chip.classList.add('active'); activeCat = cat; }
      applyFilters();
    });
    row.appendChild(chip);
  });
}

document.querySelectorAll('#tab-domain .tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('#tab-domain .tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    activeDomain = t.dataset.domain;
    applyFilters();
  });
});

document.querySelectorAll('#tab-tier .tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('#tab-tier .tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    activeTier = t.dataset.tier;
    applyFilters();
  });
});

function getFiltered() {
  let list = allLessons;
  if (activeDomain === 'math') list = mathLessons;
  if (activeDomain === 'phys') list = physLessons;
  if (activeTier !== 'all') list = list.filter(l => (l.tier || '★★') === activeTier);
  if (activeCat) list = list.filter(l => l.category === activeCat);
  const q = document.getElementById('search').value.trim();
  if (q && q.length > 0) {
    if (activeDomain === 'all' && activeTier === 'all' && !activeCat) {
      list = fuse.search(q).map(r => r.item);
    } else {
      const ids = new Set(list.map(l => l.id));
      list = fuse.search(q).map(r => r.item).filter(l => ids.has(l.id));
    }
  }
  return list;
}

function applyFilters() {
  const list = getFiltered();
  const grid = document.getElementById('grid');
  const total = allLessons.length;
  document.getElementById('result-count').textContent = `显示 ${list.length} / ${total} 门课程`;
  if (list.length === 0) {
    grid.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><p>没有匹配的课程</p><div class="hint">试试更短的关键词，或点击「清除筛选」查看全部课程</div></div>';
    return;
  }
  const tiers = { '★': '基础', '★★': '核心', '★★★': '前沿' };
  const parts = {};
  list.forEach(l => {
    const key = (isPhysics(l.category) ? '⚛️ 物理' : '📐 数学') + '  |  ' + (l.tier || '★★') + ' ' + tiers[l.tier || '★★'];
    if (!parts[key]) parts[key] = [];
    parts[key].push(l);
  });
  let html = '';
  const q = document.getElementById('search').value.trim().toLowerCase();
  for (const [section, lessons] of Object.entries(parts)) {
    html += `<div class="section-header"><h2>${section} (${lessons.length})</h2></div>`;
    html += '<div class="grid">';
    lessons.forEach(l => {
      // content snippet when searching
      let snippet = l.desc;
      if (q && l.content) {
        const idx = l.content.toLowerCase().indexOf(q);
        if (idx !== -1) {
          const start = Math.max(0, idx - 30);
          snippet = '…' + l.content.slice(start, start + 70) + '…';
        }
      }
      html += `<a href="${import.meta.env.BASE_URL}pages/${l.id}.html" class="card">
        <span class="emoji">${l.emoji}</span>
        <span class="info">
          <h3>${l.title}
            <span class="tier-dot" style="background:${l.tier==='★'?'#7ee787':l.tier==='★★★'?'#f78166':'#58a6ff'}"></span>
          </h3>
          <p>${snippet}</p>
          <span class="cat-tag">${l.category}</span>
        </span>
      </a>`;
    });
    html += '</div>';
  }
  grid.innerHTML = html;
}

function clearFilters() {
  activeDomain = 'all'; activeTier = 'all'; activeCat = '';
  document.getElementById('search').value = '';
  document.querySelectorAll('#tab-domain .tab').forEach((t,i) => t.classList.toggle('active', i===0));
  document.querySelectorAll('#tab-tier .tab').forEach((t,i) => t.classList.toggle('active', i===0));
  document.querySelectorAll('#chip-cats .chip').forEach(c => c.classList.remove('active'));
  applyFilters();
}
</script>
<script>
(function(){try{var s=JSON.parse(localStorage.getItem('vm_done_v1')||'{}');var n=0;document.querySelectorAll('a[href*="/pages/"]').forEach(function(a){var m=(a.getAttribute('href')||'').match(/\/([^\/]+)\.html$/);if(!m)return;if(s[m[1]]){var sp=document.createElement('span');sp.textContent='✓';sp.style.cssText='color:#3fb950;font-weight:bold;margin-left:4px';a.appendChild(sp);n++;}});var bar=document.getElementById('result-count');if(bar&&bar.textContent.indexOf('课程')>-1){bar.textContent+=' · 已完成 '+n;} }catch(e){}})();
</script>
</body>
</html>
