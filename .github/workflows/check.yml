name: QA

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - name: Ensure generated outputs are committed & fresh
        run: |
          npm run gen
          git diff --exit-code -- pages public curriculum.json content learn.html quals.html README.md index.html src/sketches scripts || \
            (echo "::error:: generated outputs changed — run npm run gen and commit"; exit 1)
